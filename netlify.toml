[build]
  command = "npm ci"
  functions = "netlify/functions"
  publish = "."

[build.environment]
  NODE_VERSION = "20.12.2"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
